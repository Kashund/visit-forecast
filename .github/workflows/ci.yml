name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.9.6
      - name: Verify lockfile
        run: uv lock --check
      - name: Install locked environment
        run: uv sync --locked --extra dev --no-editable
      - name: Verify installed package and CLI
        run: |
          uv run --no-editable python -c "import visit_forecast; print(visit_forecast.__file__)"
          uv run --no-editable python scripts/run_forecast_cli.py --help
      - name: Test
        run: uv run --no-editable python -m pytest -q
      - name: Compile
        run: uv run --no-editable python -m compileall -q src apps scripts
      - name: Build wheel
        run: uv build --wheel
